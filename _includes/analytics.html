{% if site.google_analytics %}
<!-- Google Analytics 4 (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  
  // Configure GA4 with privacy settings
  gtag('config', '{{ site.google_analytics }}', {
    // Page tracking
    page_title: '{{ page.title | default: site.title }}',
    page_location: '{{ site.url }}{{ page.url }}',
    
    // Privacy settings
    anonymize_ip: true,
    cookie_flags: 'SameSite=None;Secure',
    
    // Performance settings
    send_page_view: true,
    
    // Custom dimensions (optional)
    custom_map: {
      'dimension1': 'page_type'
    }
  });

  // Track custom events for portfolio interactions
  function trackEvent(eventName, parameters = {}) {
    gtag('event', eventName, {
      event_category: 'Portfolio Interaction',
      event_label: parameters.label || '',
      value: parameters.value || 0,
      ...parameters
    });
  }

  // Track resume downloads
  document.addEventListener('DOMContentLoaded', function() {
    const resumeLinks = document.querySelectorAll('a[href*="resume"]');
    resumeLinks.forEach(link => {
      link.addEventListener('click', function() {
        trackEvent('resume_download', {
          event_category: 'File Download',
          event_label: 'Resume PDF'
        });
      });
    });

    // Track external link clicks
    const externalLinks = document.querySelectorAll('a[href^="http"]:not([href*="mvamsi.com"])');
    externalLinks.forEach(link => {
      link.addEventListener('click', function() {
        trackEvent('external_link_click', {
          event_category: 'External Link',
          event_label: this.href
        });
      });
    });

    // Track social media clicks
    const socialLinks = document.querySelectorAll('.social-top a, .footer a[href*="github"], a[href*="linkedin"], a[href*="twitter"], a[href*="x.com"]');
    socialLinks.forEach(link => {
      link.addEventListener('click', function() {
        const platform = this.href.includes('github') ? 'GitHub' : 
                         this.href.includes('linkedin') ? 'LinkedIn' : 
                         this.href.includes('twitter') || this.href.includes('x.com') ? 'X/Twitter' : 'Social';
        trackEvent('social_media_click', {
          event_category: 'Social Media',
          event_label: platform
        });
      });
    });
  });
</script>
{% endif %}
